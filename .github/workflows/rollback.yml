name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release a republicar (ex.: v1.0.0)"
        required: true
        type: string

run-name: "Rollback para ${{ inputs.tag }}"

concurrency:
  group: producao
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # O envio fica em um job anterior ao deploy: no mesmo job, o deploy-pages
  # às vezes não encontra o artefato recém-enviado.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Conferir se a Release existe
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag inválida: use vX.Y.Z"; exit 1; }
          gh release view "$TAG" > /dev/null

      - name: Checkout da tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Publicar artefato (pasta src)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "src"

  production:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Marcar a Release como Latest
        run: gh release edit "$TAG" --latest
